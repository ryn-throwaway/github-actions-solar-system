name: Solar System Workflow

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest
    container:
      image: node:20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache NPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install Dependencies
        run: npm install

      - name: Unit Testing
        run: npm test

      - name: Archive Test Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-Test-Result
          path: test-results.xml

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup NodeJS Version
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Code Coverage
        run: npm run coverage
        continue-on-error: true

      - name: archive coverage results
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Result
          path: coverage
          retention-days: 5

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [code-coverage,unit-testing]
    permissions:
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: GHCR Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GHCR Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: 'ghcr.io/${{ github.repository_owner }}/solar-system:${{ github.sha }}'

  dev-deploy:
    name: Dev Deploy
    runs-on: ubuntu-latest
    needs: [docker]
    environment:
      name: development
    steps:
      - name: Install Cluster
        uses: helm/kind-action@v1

      - name: Deploy solar
        run: |
          sleep 60
          kubectl -n kube-system get pod
          set +e
          REPO_OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          kubectl run solar --image ghcr.io/${REPO_OWNER_LC}/solar-system:${{ github.sha }} \
             --env MONGO_URI=${{ env.MONGO_URI}} \
             --env MONGO_USERNAME=${{ env.MONGO_USERNAME}} \
             --env MONGO_PASSWORD=${{ env.MONGO_PASSWORD}}
          set -e
          echo "kubectl returned $?"
          kubectl -n default get pod
          sleep 10a
